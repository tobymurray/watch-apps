[package]
name = "squashlab_engine"
version = "0.1.0"
edition = "2021"
description = "The SquashLab Service's half of EffortKit: a C ABI over the shot detector, so the count on the drill screen and the count a later analysis gets off the same recording are computed by one implementation."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "lib"]

[features]
std = ["effortkit/std"]

[dependencies]
# A dependency, never a second staticlib: two archives each carrying a
# #[panic_handler] collide at link time.
effortkit = { path = "../../../../EffortKit" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
