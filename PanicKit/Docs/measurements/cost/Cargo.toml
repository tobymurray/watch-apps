[package]
name = "panicprobe"
version = "0.0.0"
edition = "2021"

[features]
default = []
literal = []
location = []
# The crate's own message handler, not a replica: `panic` is behind
# `panic-handler`, and measuring a copy would stop tracking what ships.
full = ["panickit/panic-message"]
location_min = []

[dependencies]
panickit = { path = "../../..", default-features = false }
inscribed-disc = { path = "../../../../InscribedDisc", default-features = false, features = [
    "embedded-graphics",
    "abgr2222",
] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
