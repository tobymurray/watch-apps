[package]
name = "panickit"
version = "0.1.0"
edition = "2021"
# MEASURED, not inherited: `panic-message` needs `PanicInfo::message()`, which
# stabilised in 1.81.0. `cargo +1.80.1 build --features panic-message` fails
# with `error[E0658]: use of unstable library feature 'panic_info_message'`.
# The location half alone builds at 1.71.1.
rust-version = "1.81"
license = "MIT"
description = "One #[panic_handler] for the UNA Watch's Rust halves, reporting through one symbol the C++ host defines."
publish = false

[features]
default = []
## The handler itself, reporting `file:line`. Measured at 319 bytes over
## reporting nothing. Inert under `std`, and a host test build needs that: with
## this on and `std` off the crate owns `panic_impl`, so every doc-test fails to
## link with E0152. Test it as `--features panic-handler,std`.
panic-handler = []
## Adds the panic message to the location. This is the expensive half: it needs
## `core::fmt`, measured at +2,210 bytes of `.text` linking Spin's real
## renderer, against 319 for the location alone. Opt in when the message is
## worth three kilobytes of a 600 KiB window.
panic-message = ["panic-handler"]
## Host-side assertions in tests.
std = []

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
