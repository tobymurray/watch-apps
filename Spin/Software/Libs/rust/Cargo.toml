[package]
name = "spin_engine"
version = "0.1.0"
edition = "2021"
description = "The Spin Service's half of EffortKit: a C ABI over the recovery detector and the cross-app session log, with all state static because the Service has no allocator and one thread."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "lib"]

[features]
std = ["effortkit/std"]

[dependencies]
# A dependency, never a second staticlib: two archives each carrying a
# #[panic_handler] collide at link time.
effortkit = { path = "../../../../EffortKit" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
