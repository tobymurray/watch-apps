name: App build

# The shared half of every app's CI. One app per call, and everything an app
# might need is discovered rather than declared, so wiring a new one up is a
# caller file with a directory name in it and nothing else.
#
# What it does depends on what the directory holds:
#
#   app-manifest.json                   -> validate it against the binary's own
#                                          copy of the field table
#   Tests/CMakeLists.txt                -> configure, build and run the host tests
#   Software/Apps/CustomGUI/rust/       -> run the Rust renderer's own unit tests
#   Software/Apps/<name>-CMake/         -> build the .uapp and upload it
#
# An app with none of the three is a mistake rather than a no-op, so it fails.
# MapKit is the case that makes discovery worth having over three booleans: it
# is a library with host tests and no binary, and it needs no special handling.
#
# Ported from tobymurray/kira's app-binaries.yml, which builds the SDK's own
# example apps. What carried over is the shape -- one pinned container, the SDK
# checked out beside the source, artifacts named by what produced them. What did
# not is the content-addressed store and the release walking, which exist to
# rebuild upstream's history and have nothing to say here.

on:
  workflow_call:
    inputs:
      app:
        description: 'The app directory, e.g. Barcode'
        required: true
        type: string
      version:
        description: 'Version to stamp. Defaults to appVersion in the app manifest.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

env:
  # Pinned by digest, not by tag: a re-pushed tag would silently change the
  # compiler and there would be nothing in the diff to say so.
  #
  # This used to point at tobymurray/kira's own kira-toolchain image, on the
  # theory that this repository could share it. It could not: the package is
  # private, this repository was never granted Actions access to it, and a
  # digest that pulled fine in one run returned "manifest unknown" for the
  # identical string minutes later once kira itself moved the tag in
  # tobymurray/kira#61 without updating its own pin -- see toolchain.yml and
  # toolchain/Dockerfile, this repository's own copy of that same recipe,
  # published to its own package instead. A same-repository package needs no
  # cross-repository grant, which is what actually fixed the pull.
  #
  # It has to be repeated in `container.image` below, because the `env` context
  # is not available where a job declares its container.
  TOOLCHAIN: ghcr.io/tobymurray/watch-apps-toolchain@sha256:cca44e2ca090850480a612f4ed3d4acbd317f3bd32516b0d8fe323cf37c0ee26

  # The SDK is a separate repository and every app in this one builds against it,
  # so it is pinned here rather than floating on a branch: an SDK commit that
  # breaks an app should break it in a run somebody can point at, not silently on
  # whatever day main moved. Bumping this is a one-line change that rebuilds
  # every app, which is the correct blast radius for changing the SDK.
  SDK_REPO: tobymurray/una-sdk
  SDK_REF: 8cdb73140a3d97455b80c22d32e5012e26f72291

jobs:
  build:
    name: ${{ inputs.app }}
    runs-on: ubuntu-latest
    permissions:
      # write is for the version-bump commit/tag and the release it publishes,
      # both gated to real pushes further down -- a pull_request run gets a
      # read-only token regardless of what this says, same reasoning as
      # toolchain.yml's identical override.
      contents: write
      packages: read
    container:
      image: ghcr.io/tobymurray/watch-apps-toolchain@sha256:cca44e2ca090850480a612f4ed3d4acbd317f3bd32516b0d8fe323cf37c0ee26
      # Published by this repository's own toolchain.yml, so the default
      # GITHUB_TOKEN can always pull it -- no cross-repository grant needed,
      # which was the whole problem with depending on kira's package instead.
      # Authenticating still costs nothing, so it stays explicit rather than
      # relying on that being true.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the apps
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: apps
          # Full history and tags, not the default single commit: the version
          # bump below needs every commit back to this app's last <app>-*
          # tag, and git describe --tags needs the tags themselves fetched to
          # find it at all.
          fetch-depth: 0
          fetch-tags: true

      - name: Check out the SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          persist-credentials: false
          path: sdk

      # No separate "install the packer's requirements" step: toolchain/Dockerfile
      # installs pyelftools and Pillow via apt, so the image already satisfies
      # sdk/Utilities/Scripts/app_packer/requirements.txt. A pip step doing that
      # again was left over from depending on kira's image, which does the same
      # thing kira's own app-binaries.yml still does redundantly.

      - name: Work out what this app has
        id: app
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app }}"
          dir="apps/$app"
          [ -d "$dir" ] || { echo "::error::no such app directory: $app"; exit 1; }

          manifest="$dir/app-manifest.json"
          tests="$dir/Tests/CMakeLists.txt"
          cmake=$(find "$dir/Software/Apps" -maxdepth 2 -name CMakeLists.txt 2>/dev/null | head -n 1 || true)
          # An app's Rust is a crate with its own unit tests, and they cover
          # what no host test in Tests/ can reach: a CustomGUI app's drawing,
          # and a Service-side engine's arithmetic. Searched across the whole
          # app rather than under Software/Apps, because the engine crates live
          # beside the C++ they are linked into, in Software/Libs.
          crates=$(find "$dir" -name Cargo.toml -not -path '*/target/*' 2>/dev/null | sort || true)
          # A shared crate an app links by path is exercised by its consumers,
          # the way TextKit's atlases are: it has no workflow of its own, so a
          # build of an app that depends on it is what runs its tests.
          for shared in EffortKit TextKit; do
            if [ -n "$crates" ] && echo "$crates" | xargs -r grep -l "$shared" >/dev/null 2>&1 \
               && [ -f "apps/$shared/Cargo.toml" ]; then
              crates=$(printf '%s\napps/%s/Cargo.toml\n' "$crates" "$shared")
            fi
          done
          crates=$(echo "$crates" | grep . | sort -u || true)
          crate=$(echo "$crates" | head -n 1)
          # A renderer that draws text does it through the shared TextKit
          # crate, whose atlases are generated files checked in beside their
          # generator; a build of this app is the only thing that exercises
          # them, so it is what checks they are current.
          textkit=no
          if [ -n "$crate" ] && grep -q 'TextKit' "$crate"; then textkit=yes; fi

          {
            echo "manifest=$([ -f "$manifest" ] && echo "$manifest" || echo '')"
            echo "tests=$([ -f "$tests" ] && dirname "$tests" || echo '')"
            echo "cmake=$([ -n "$cmake" ] && dirname "$cmake" || echo '')"
            echo "crate=$([ -n "$crate" ] && dirname "$crate" || echo '')"
            echo "crates<<EOF"
            for c in $crates; do [ -n "$c" ] && dirname "$c"; done
            echo "EOF"
            echo "textkit=$textkit"
          } >> "$GITHUB_OUTPUT"

          echo "app       $app"
          echo "manifest  ${manifest#apps/}$([ -f "$manifest" ] || echo ' (none)')"
          echo "tests     $([ -f "$tests" ] && echo yes || echo no)"
          echo "crates    $(echo "$crates" | grep -c . || true)"
          echo "textkit   $textkit"
          echo "buildable $([ -n "$cmake" ] && echo yes || echo no)"

          if [ ! -f "$manifest" ] && [ ! -f "$tests" ] && [ -z "$cmake" ]; then
            echo "::error::$app has no manifest, no tests and nothing to build"
            exit 1
          fi

      # A version has to come from somewhere it can be reviewed. The manifest
      # is that place, and an explicit input overrides it for a one-off build
      # -- in which case this step just passes that version through unchanged
      # and bumps nothing, same as a pull_request run does.
      #
      # On a real push with no override, this is also where the actual
      # release trio -- bump, commit, tag -- happens now, instead of being a
      # person's job every time. Strict semver, taken from the commit type
      # this repository's history already prefixes every commit with: feat
      # resets patch and bumps minor, fix bumps only patch, a `!` before the
      # colon bumps major and resets both. The highest level found among
      # every qualifying commit since this app's last <app>-*.*.* tag wins,
      # and a push with none of the three -- only chore/docs/ci/test/refactor
      # -- bumps nothing and builds whatever version is already on disk,
      # exactly as if this step were not here.
      - name: Bump the version, if this push earns one
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          manifest="${{ steps.app.outputs.manifest }}"
          version="${{ inputs.version }}"
          current=""
          tag=""
          notes=""

          # No manifest at all -- a buildable app with none, the one case
          # discovery still lets through -- means nothing here to bump or
          # read a version from; inputs.version (or nothing, which the check
          # below catches) is all there is.
          if [ -n "$manifest" ]; then
            manifest_rel="${manifest#apps/}"
            current="$(jq -r '.appVersion // empty' "$manifest")"
            [ -z "$version" ] && version="$current"
          fi

          rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }

          if [ "${{ github.event_name }}" = "push" ] && [ -z "${{ inputs.version }}" ] && [ -n "$current" ]; then
            tag_prefix="$(echo "${{ inputs.app }}" | tr '[:upper:]' '[:lower:]')-"
            last_tag="$(git -C apps describe --tags --match "${tag_prefix}*" --abbrev=0 2>/dev/null || true)"
            range="${last_tag:+$last_tag..}HEAD"
            echo "scanning $range for ${{ inputs.app }} (last tag: ${last_tag:-none})"

            bump=none
            while IFS= read -r subject; do
              [ -z "$subject" ] && continue
              level=""
              if echo "$subject" | grep -qP '^\w+(\([^)]*\))?!:'; then
                level=major
              elif echo "$subject" | grep -qP '^feat(\([^)]*\))?:'; then
                level=minor
              elif echo "$subject" | grep -qP '^fix(\([^)]*\))?:'; then
                level=patch
              fi
              [ -z "$level" ] && continue
              echo "  $level: $subject"
              notes="${notes}- ${subject}"$'\n'
              if [ "$(rank "$level")" -gt "$(rank "$bump")" ]; then
                bump="$level"
              fi
            done < <(git -C apps log --format=%s "$range" -- "${{ inputs.app }}")

            echo "bump: $bump"

            if [ "$bump" != none ]; then
              IFS=. read -r major minor patch <<< "$current"
              case "$bump" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              version="$major.$minor.$patch"
              tag="${tag_prefix}${version}"

              jq --arg v "$version" '
                .appVersion = $v
                | .binary = (.binary | sub("_[0-9]+\\.[0-9]+\\.[0-9]+\\.uapp$"; "_" + $v + ".uapp"))
              ' "$manifest" > "${manifest}.tmp"
              mv "${manifest}.tmp" "$manifest"

              git -C apps config user.name "github-actions[bot]"
              git -C apps config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C apps add "$manifest_rel"
              commit_msg=$(printf 'chore(%s): version %s\n\nAutomatic %s bump, from the commit(s) since %s:\n\n%s' \
                "$(echo "${{ inputs.app }}" | tr '[:upper:]' '[:lower:]')" "$version" "$bump" \
                "${last_tag:-the beginning}" "$notes")
              git -C apps commit --quiet -m "$commit_msg"

              # One push can touch several apps (a shared crate, this file),
              # and each app's job then races to land its own bump on main;
              # the losers were rejected as non-fast-forward the first time it
              # happened. The bump touches only this app's manifest, so it
              # rebases cleanly onto whatever the others landed. The branch
              # goes first and alone: a push of branch and tag together is not
              # atomic, and the second time this ran the tag was accepted while
              # the branch was rejected, leaving a tag on a commit main never
              # had and every retry refused for the tag it had already pushed.
              # The tag follows only once the branch is in, and is forced so a
              # retry after a partial failure cannot be refused for it.
              remote="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
              pushed=no
              for attempt in 1 2 3 4 5; do
                git -C apps fetch --quiet "$remote" main
                git -C apps rebase --quiet FETCH_HEAD
                if git -C apps push --quiet "$remote" HEAD:main; then
                  pushed=yes
                  break
                fi
                echo "push attempt $attempt rejected, main moved; rebasing and retrying"
                sleep $((attempt * 5))
              done
              if [ "$pushed" != yes ]; then
                echo "::error::could not land the version bump after 5 attempts"
                exit 1
              fi
              git -C apps tag -f "$tag" > /dev/null
              git -C apps push --quiet --force "$remote" "refs/tags/$tag"
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "notes<<BUMPNOTES_EOF"
            echo "$notes"
            echo "BUMPNOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "${{ steps.app.outputs.cmake }}" ] && [ -z "$version" ]; then
            echo "::error::${{ inputs.app }} is buildable but has no version -- add appVersion to its manifest, or pass one in"
            exit 1
          fi

      # The manifest is the contract the phone renders a form from, and the
      # binary carries its own copy of it. They are two files that must agree and
      # nothing but this check makes them.
      - name: Validate the configuration contract
        if: steps.app.outputs.manifest != ''
        shell: bash
        run: |
          set -euo pipefail
          bounds=$(find "apps/${{ inputs.app }}/Software/Libs/Sources" -name 'AppConfigFields.cpp' | head -n 1)
          args=(--check "${{ steps.app.outputs.manifest }}")
          [ -n "$bounds" ] && args+=(--check-bounds "$bounds")
          python3 sdk/Utilities/Scripts/app_packer/validate_app_config.py "${args[@]}"

      # The other half of the manifest that has to agree with something real:
      # minKernelVersion is a floor derived from the SDK's own ABI
      # (KERNEL_INTERFACE_VERSION), and the SDK this job builds against is the
      # one pinned at the top of this file. Declaring a lower floor than the
      # ABI needs produces an app the store will happily offer to a watch whose
      # kernel refuses to launch it -- a failure with nothing in the diff to
      # explain it, because the .uapp header looks identical either way.
      #
      # Checked rather than stamped: raising the floor changes who can install
      # the app, which is a decision to make in a commit, not a side effect of
      # a build. A developer may declare HIGHER than the floor (to require a
      # firmware bugfix at the same ABI) and this passes.
      - name: Check the minimum kernel version against the SDK ABI
        if: steps.app.outputs.manifest != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 sdk/Utilities/Scripts/app_packer/min_kernel_version.py \
            --check "${{ steps.app.outputs.manifest }}"

      - name: Host tests
        if: steps.app.outputs.tests != ''
        shell: bash
        env:
          UNA_SDK: ${{ github.workspace }}/sdk
        run: |
          set -euo pipefail
          cmake -B /tmp/host-tests -S "${{ steps.app.outputs.tests }}"
          cmake --build /tmp/host-tests -j"$(nproc)"
          ctest --test-dir /tmp/host-tests --output-on-failure

      # --features std, not a bare `cargo test`: the crate is no_std for the
      # watch, and a test binary cannot link a crate whose panics do not
      # unwind. Run before the .uapp build so a renderer regression fails here
      # rather than after several minutes of cross-compiling.
      - name: Rust tests
        if: steps.app.outputs.crate != ''
        shell: bash
        run: |
          set -euo pipefail
          # Every crate the app carries, not just the first: an app can have a
          # renderer and an engine, and running one of the two silently is
          # worse than running neither.
          while IFS= read -r crate; do
            [ -n "$crate" ] || continue
            echo "--- $crate"
            ( cd "$crate" && cargo test --features std )
          done <<< "${{ steps.app.outputs.crates }}"

      # TextKit's src/faces.rs is what Tools/atlas.py writes, checked in so an
      # app builds without FreeType; --check regenerates it in place and fails
      # if a face in faces.json changed without the output following. The
      # image carries the pinned freetype-py, fonttools and numpy the tool
      # needs (toolchain/Dockerfile). The crate's own tests hold every atlas
      # glyph to the TouchGFX-generated tables in Squash, which is the parity
      # claim this repository makes about them.
      - name: TextKit atlases are current and match TouchGFX
        if: steps.app.outputs.textkit == 'yes'
        shell: bash
        working-directory: apps/TextKit
        run: |
          set -euo pipefail
          python3 Tools/atlas.py --check
          cargo test --features std

      - name: Build the app
        if: steps.app.outputs.cmake != ''
        id: uapp
        shell: bash
        env:
          UNA_SDK: ${{ github.workspace }}/sdk
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          pushd "${{ steps.app.outputs.cmake }}" > /dev/null
          cmake -B build -G 'Unix Makefiles' -DBUILD_VERSION="$version" .
          # 2>&1 before the pipe, not after: app_packer.py logs through Python's
          # logging module, which writes to stderr by default. Piping stdout
          # alone silently dropped every line the CRC/size extraction below
          # depends on -- the build still succeeded, so nothing caught it.
          cmake --build build -j"$(nproc)" 2>&1 | tee /tmp/build.log
          popd > /dev/null

          # The packer writes the image twice, into the build directory and into
          # the app's Output/. Output/ is the one the repository treats as the
          # artifact, so prefer it rather than letting find's order decide.
          app_dir="apps/${{ inputs.app }}"
          uapp=$(find "$app_dir/Output" -name "*_${version}.uapp" 2>/dev/null | head -n 1)
          [ -n "$uapp" ] || uapp=$(find "$app_dir" -name "*_${version}.uapp" | head -n 1)
          [ -n "$uapp" ] || { echo "::error::the build produced no .uapp for $version"; exit 1; }

          # Staged into one flat directory so the download is the two files
          # somebody actually wants, rather than them buried four levels down a
          # build tree that only means something inside this job.
          stage="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$stage"
          cp "$uapp" "$stage/"
          manifest="${{ steps.app.outputs.manifest }}"
          [ -n "$manifest" ] && cp "$manifest" "$stage/"

          # The icon is a store-submission concern this workflow otherwise knows
          # nothing about, so it is discovered rather than declared, the same way
          # everything else here is: present, it travels with the build as
          # icon.png; absent, the build is just the manifest and the binary.
          # Staged here rather than only before the release zip further down, so
          # the plain CI artifact (what a run page download gives you) carries it
          # too -- it, not just the release asset, is a manifest referencing
          # icon.png plus the files that manifest promises.
          icon="$app_dir/Resources/icon_store.png"
          [ -f "$icon" ] && cp "$icon" "$stage/icon.png"

          # The packer prints these and the repository's release tags record them,
          # so a run is a place to look them up rather than a reason to rebuild.
          crc=$(grep -oE 'CRC[[:space:]]*:[[:space:]]*0x[0-9A-Fa-f]+' /tmp/build.log | tail -n 1 | grep -oE '0x[0-9A-Fa-f]+' || echo unknown)
          {
            echo "uapp=$uapp"
            echo "crc=$crc"
            echo "bytes=$(stat -c %s "$uapp")"
            echo "stage=artifact"
          } >> "$GITHUB_OUTPUT"
          echo "staged: $(ls "$stage")"

      - name: Summary
        if: always() && steps.uapp.outputs.uapp != ''
        shell: bash
        run: |
          {
            echo "### ${{ inputs.app }} ${{ steps.bump.outputs.version }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| bytes | ${{ steps.uapp.outputs.bytes }} |"
            echo "| CRC | ${{ steps.uapp.outputs.crc }} |"
            echo "| SDK | \`${SDK_REF}\` |"
            echo "| toolchain | \`${TOOLCHAIN##*@}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The binary and the manifest travel together, because that is what an
      # upload to the store is: the manifest never reaches the watch, so a change
      # to it is invisible in the .uapp and still changes what a wearer sees.
      - name: Upload the build
        if: steps.uapp.outputs.uapp != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-${{ steps.bump.outputs.version }}
          path: ${{ steps.uapp.outputs.stage }}
          if-no-files-found: error

      # Only when this run actually cut a new version: rebuilding an
      # already-tagged version, or a manifest-less app with no uapp to
      # release, produces the ordinary CI artifact above and stops there.
      #
      # NOTES is passed through env rather than interpolated with ${{ }}
      # directly into the script below, on purpose: it is built from commit
      # subject lines, which this repository's only committer controls today
      # but which are still arbitrary text, and ${{ }} substitutes into the
      # *script source* before bash ever sees it -- a subject containing a
      # `"` or a `$(...)` would otherwise be executed rather than quoted.
      # VERSION and TAG do not need the same treatment; both come only from
      # this job's own semver arithmetic and are never free text.
      - name: Publish the release
        if: steps.uapp.outputs.uapp != '' && steps.bump.outputs.tag != ''
        shell: bash
        env:
          NOTES: ${{ steps.bump.outputs.notes }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          stage="${{ steps.uapp.outputs.stage }}"

          # icon.png, if the app has one, is already in $stage -- copied in
          # during "Build the app" so the plain CI artifact carries it too, not
          # just this release zip.
          zip_path="$RUNNER_TEMP/${{ inputs.app }}_${VERSION}.zip"
          (cd "$stage" && python3 -m zipfile -c "$zip_path" *)

          body="${NOTES:-No fix: or feat: commits since the last release.}"
          release_json=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg name "${{ inputs.app }} $VERSION" --arg body "$body" \
                  '{tag_name: $tag, name: $name, body: $body}')")

          release_id=$(echo "$release_json" | jq -r '.id // empty')
          if [ -z "$release_id" ]; then
            echo "::error::release creation failed: $(echo "$release_json" | jq -r '.message // "unknown error"')"
            exit 1
          fi

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary "@$zip_path" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${release_id}/assets?name=$(basename "$zip_path")" \
            | jq -r '"uploaded: " + (.name // .message // "unknown")'

          echo "Released [$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
