name: InscribedDisc

# The crate's own checks: correct, no_std, and still holding its measurements.

on:
  push:
    branches: [main]
    paths:
      - 'InscribedDisc/**'
      - '.github/workflows/inscribed-disc.yml'
  pull_request:
    paths:
      - 'InscribedDisc/**'
      - '.github/workflows/inscribed-disc.yml'
  workflow_dispatch:

concurrency:
  group: inscribed-disc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  # The C++ half type-checks against the SDK's headers. Must track
  # app-build.yml's pin: two workflows on two SDK commits are two instruments.
  SDK_REPO: UNAWatch/una-sdk
  SDK_REF: bd04a5b8ebc7cb56cdbabe7071bad0468f9f7249

jobs:
  # On a stock runner: the toolchain image has clippy-driver on PATH but no
  # clippy component, so `cargo clippy` fails there.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every column, because a cfg mistake is invisible with every feature on.
      - name: Clippy, and rustc's own warnings, across the feature matrix
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          rustup component add clippy
          cargo clippy --all-features --all-targets -- -D warnings
          cargo clippy --no-default-features --all-targets -- -D warnings
          for f in embedded-graphics abgr2222 std preview \
                   "embedded-graphics,abgr2222"; do
            echo "--- $f"
            cargo clippy --no-default-features --features "$f" --all-targets \
              -- -D warnings
          done

  test:
    runs-on: ubuntu-latest
    # The container's default shell is sh, which has no `pipefail`.
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/tobymurray/watch-apps-toolchain@sha256:cca44e2ca090850480a612f4ed3d4acbd317f3bd32516b0d8fe323cf37c0ee26
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out the SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          persist-credentials: false
          path: sdk

      - name: Tests
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          cargo test --all-features
          cargo test --no-default-features
          cargo test --no-default-features --features embedded-graphics

      - name: The zero-dependency core alone
        working-directory: InscribedDisc
        run: cargo build --release --target thumbv8m.main-none-eabihf --no-default-features

      # A build succeeds whether or not embedded-graphics was resolved; this
      # does not.
      - name: The core resolves no dependencies
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          tree=$(cargo tree --no-default-features -e normal)
          echo "$tree"
          [ "$(echo "$tree" | wc -l)" -eq 1 ] || {
            echo "::error::--no-default-features resolved a dependency"; exit 1; }

      - name: The watch target, every feature
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          for f in embedded-graphics abgr2222 "embedded-graphics,abgr2222"; do
            echo "--- $f"
            cargo build --release --target thumbv8m.main-none-eabihf \
              --no-default-features --features "$f"
          done

      - name: A second, non-ARM target
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          rustup target add riscv32imac-unknown-none-elf
          cargo build --release --target riscv32imac-unknown-none-elf --no-default-features
          cargo build --release --target riscv32imac-unknown-none-elf \
            --no-default-features --features abgr2222

      # Catches a rename across the C ABI, which needs no ARM toolchain.
      - name: The shell header type-checks against the SDK
        env:
          UNA_SDK: ${{ github.workspace }}/sdk
        run: |
          set -euo pipefail
          cat > /tmp/shell_check.cpp <<'EOF'
          #include "GuiShell.hpp"
          using namespace inscribed_disc;
          struct DemoApp {
              static uint32_t abiFingerprint() { return 1; }
              static uint32_t expectedFingerprint() { return 1; }
              static void render(uint8_t*, uint32_t, uint16_t, uint16_t) {}
              static Action onButton(Button, Press) { return Action::Redraw; }
              static Action onTick(uint32_t) { return Action::Ignore; }
              static void onResume() {}
              static void onSuspend() {}
          };
          template class inscribed_disc::Shell<DemoApp>;
          EOF
          "${CXX:-g++}" -fsyntax-only -std=c++17 -fno-exceptions \
            -I"$UNA_SDK/Libs/Header" -I InscribedDisc/Header /tmp/shell_check.cpp

      # docs.rs builds with all features.
      - name: Documentation, with the feature matrix
        working-directory: InscribedDisc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  # Against the newest version on crates.io, with every feature on.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: InscribedDisc/Cargo.toml
          feature-group: all-features
