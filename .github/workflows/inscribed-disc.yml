name: InscribedDisc

# A shared crate belongs to no app, so no app's workflow builds it. This is what
# proves the crate is still correct, still no_std, and still holding the
# measurements it claims.

on:
  push:
    branches: [main]
    paths:
      - 'InscribedDisc/**'
      - '.github/workflows/inscribed-disc.yml'
  pull_request:
    paths:
      - 'InscribedDisc/**'
      - '.github/workflows/inscribed-disc.yml'
  workflow_dispatch:

concurrency:
  group: inscribed-disc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  # The C++ half type-checks against the SDK's headers. Must track
  # app-build.yml's pin: two workflows on two SDK commits are two instruments.
  SDK_REPO: tobymurray/una-sdk
  SDK_REF: 8cdb73140a3d97455b80c22d32e5012e26f72291

jobs:
  # Not in the toolchain container: that image carries cargo-clippy and
  # clippy-driver on PATH but no clippy component, so `cargo clippy` fails with
  # "not installed for the toolchain" -- a tool that answers rather than being
  # absent. This crate needs no SDK and no ARM toolchain to lint, so it runs on a
  # stock runner instead.
  #
  # -D warnings covers rustc's own as well as clippy's. That matters: the lint
  # this job was added for was an unused import, and a `grep` over a warm
  # `cargo build` had reported the crate clean three times, because cargo does
  # not re-emit warnings for a crate it did not recompile.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --all-features alone lints one column of the feature matrix. It missed
      # two real defects: test modules that used `color` without `abgr2222`, so
      # `--features embedded-graphics` would not compile at all, and a
      # `write_location` whose cfg was wider than its only caller's. Both are
      # invisible with every feature on.
      - name: Clippy, and rustc's own warnings, across the feature matrix
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          rustup component add clippy
          cargo clippy --all-features --all-targets -- -D warnings
          cargo clippy --no-default-features --all-targets -- -D warnings
          for f in embedded-graphics abgr2222 std preview \
                   "embedded-graphics,abgr2222"; do
            echo "--- $f"
            cargo clippy --no-default-features --features "$f" --all-targets \
              -- -D warnings
          done

  test:
    runs-on: ubuntu-latest
    # The container's default shell is sh, where `set -o pipefail` is an illegal
    # option and every step below that uses a pipe would report success for a
    # command that failed. Declared once for the job rather than per step.
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/tobymurray/watch-apps-toolchain@sha256:cca44e2ca090850480a612f4ed3d4acbd317f3bd32516b0d8fe323cf37c0ee26
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out the SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          persist-credentials: false
          path: sdk

      # Every measured constant in the crate re-runs here, so a number that
      # rots fails.
      - name: Tests
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          cargo test --all-features
          # The core alone, and the default column. Neither runs above, and the
          # second was a compile error nothing caught.
          cargo test --no-default-features
          cargo test --no-default-features --features embedded-graphics

      # A `std` type reached for from the geometry core compiles fine above and
      # fails here.
      - name: The zero-dependency core alone
        working-directory: InscribedDisc
        run: cargo build --release --target thumbv8m.main-none-eabihf --no-default-features

      # The claim `geometry` makes to a consumer who wants only the predicate:
      # nothing in their tree. Nothing else says so -- a build succeeds whether
      # or not embedded-graphics was resolved.
      - name: The core resolves no dependencies
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          tree=$(cargo tree --no-default-features -e normal)
          echo "$tree"
          [ "$(echo "$tree" | wc -l)" -eq 1 ] || {
            echo "::error::--no-default-features resolved a dependency"; exit 1; }

      # The one that matters most. Nothing in the crate may need an allocator or
      # a host, and this is the only step that says so.
      - name: The watch target, every feature
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          for f in embedded-graphics abgr2222 "embedded-graphics,abgr2222"; do
            echo "--- $f"
            cargo build --release --target thumbv8m.main-none-eabihf \
              --no-default-features --features "$f"
          done

      # "Platform-generic" is a claim until something other than one ARM target
      # compiles it. This is what tests it rather than asserting it.
      - name: A second, non-ARM target
        working-directory: InscribedDisc
        run: |
          set -euo pipefail
          rustup target add riscv32imac-unknown-none-elf
          cargo build --release --target riscv32imac-unknown-none-elf --no-default-features
          cargo build --release --target riscv32imac-unknown-none-elf \
            --no-default-features --features abgr2222

      # Catches a rename across the C ABI, which needs no ARM toolchain.
      - name: The shell header type-checks against the SDK
        env:
          UNA_SDK: ${{ github.workspace }}/sdk
        run: |
          set -euo pipefail
          cat > /tmp/shell_check.cpp <<'EOF'
          #include "GuiShell.hpp"
          using namespace inscribed_disc;
          struct DemoApp {
              static uint32_t abiFingerprint() { return 1; }
              static uint32_t expectedFingerprint() { return 1; }
              static void render(uint8_t*, uint32_t, uint16_t, uint16_t) {}
              static Action onButton(Button, Press) { return Action::Redraw; }
              static Action onTick(uint32_t) { return Action::Ignore; }
              static void onResume() {}
              static void onSuspend() {}
          };
          template class inscribed_disc::Shell<DemoApp>;
          EOF
          "${CXX:-g++}" -fsyntax-only -std=c++17 -fno-exceptions \
            -I"$UNA_SDK/Libs/Header" -I InscribedDisc/Header /tmp/shell_check.cpp

      # docs.rs builds with all features, where a doc link that resolves under
      # only one of them breaks.
      - name: Documentation, with the feature matrix
        working-directory: InscribedDisc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps
