name: Toolchain image

# Builds and publishes the container every app in this repository is compiled
# in, to this repository's own package -- so app-build.yml's pull needs no
# grant on anyone else's package, only on this repository's own, which a
# same-repository workflow always has.
#
# Copied from tobymurray/kira's toolchain.yml, publishing to this repository's
# own image instead of depending on kira's.

on:
  push:
    branches: [main]
    paths:
      - "toolchain/Dockerfile"
      - ".github/workflows/toolchain.yml"
  pull_request:
    paths:
      - "toolchain/Dockerfile"
      - ".github/workflows/toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/watch-apps-toolchain

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      # write is for the pin-update commit below, effective only for
      # same-repository events; a fork pull request gets a read-only token
      # whatever this says. Both write steps are gated separately regardless.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: toolchain
          push: ${{ github.event_name != 'pull_request' }}
          # Loaded locally either way, so the checks below run against the image
          # that was just built rather than against whatever the tag resolves to.
          load: true
          tags: ${{ env.IMAGE }}:latest
          # Off deliberately: attaching a provenance manifest changes the image
          # index digest, and app-build.yml pins that digest -- turning this on
          # would move it out from under every recipe that names it, for a
          # provenance claim about the image rather than about a built .uapp.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the tools are all there
        run: |
          # No pipefail: some of these are wrapper scripts that write to stderr
          # and do not like having their stdout closed early by head.
          set -eu
          image="${{ env.IMAGE }}:latest"
          missing=0
          for tool in arm-none-eabi-gcc arm-none-eabi-g++ make cmake cargo rustc git python3 jq; do
            printf '%-20s ' "$tool"
            if out=$(docker run --rm --entrypoint "$tool" "$image" --version 2>&1); then
              echo "$out" | grep -v "environment-setup" | head -1
            else
              echo "MISSING"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]
          echo "rust targets:"
          docker run --rm --entrypoint rustup "$image" target list --installed

      # This is the fix for the failure mode that cost a whole investigation to
      # diagnose: this repository depended on kira-toolchain's pin, kira moved
      # its own tag without moving its own pin, and nothing caught the two
      # falling out of sync until a build broke. The lesson taken from that
      # was not "remember to update the pin" -- a human remembering is exactly
      # what already failed once -- it is that app-build.yml's pin should
      # never be a second copy of this digest for a human to keep in step at
      # all. This step is what keeps that true: app-build.yml is patched and
      # pushed here, in the same run that published the image the digest
      # describes, so the two cannot disagree for longer than one commit.
      - name: Keep app-build.yml's pin in sync
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          image="${{ env.IMAGE }}@${digest}"
          file=".github/workflows/app-build.yml"

          if grep -qF "$image" "$file"; then
            echo "### Toolchain image published" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "\`$image\` -- \`$file\` already pins it, nothing to update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # -E, not -e: the digest is 64 hex characters, always literal, never
          # a regex metacharacter -- but the replacement text is one Docker
          # never chose to keep short, and matching only *some* image
          # references and not others because of an unescaped dot would be a
          # worse bug than the one this step exists to prevent.
          sed -i -E "s#watch-apps-toolchain@sha256:[0-9a-f]{64}#watch-apps-toolchain@${digest}#g" "$file"

          if git diff --quiet -- "$file"; then
            echo "::error::sed matched nothing in $file -- has its image reference changed shape?"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          commit_msg=$(printf 'ci: repin app-build.yml to the toolchain image just published\n\n%s\n\nWritten by toolchain.yml, not by hand: the failure this replaces was two\ncopies of a digest that only a human kept in step, and the human missed\none. There is still only one copy after this commit; this is just the\nstep that copies it, promptly and every time.' "$image")
          git commit -m "$commit_msg"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main

          {
            echo "### Toolchain image published"
            echo
            echo "\`$image\`"
            echo
            echo "Pinned in \`$file\` by this run: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
