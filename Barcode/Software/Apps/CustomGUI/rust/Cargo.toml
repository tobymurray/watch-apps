[package]
name = "barcode_gui"
version = "0.1.0"
edition = "2021"
description = "no_std Rust rendering core for the UNA Watch Barcode app's CustomGUI: draws Code128/ITF/QR from Barcode's own encoders into an 8bpp ABGR2222 framebuffer over a C ABI, with a host simulator that runs the same render()."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "sim"
required-features = ["sim"]

[features]
std = []
sim = ["std", "dep:embedded-graphics-simulator", "dep:png"]

[dependencies]
embedded-graphics = "0.8"
embedded-graphics-simulator = { version = "0.7", optional = true }
png = { version = "0.17", optional = true }
u8g2-fonts = "0.8"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
