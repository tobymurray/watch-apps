[package]
name = "squash_engine"
version = "0.1.0"
edition = "2021"
description = "The Squash Service's half of EffortKit: a C ABI over the epoch feature accumulator, so the bars on the watch and the distributions phase-a prints are computed by one implementation."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "lib"]

[features]
std = ["effortkit/std"]

[dependencies]
# A dependency, never a second staticlib: two archives each carrying a
# #[panic_handler] collide at link time.
effortkit = { path = "../../../../EffortKit" }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
