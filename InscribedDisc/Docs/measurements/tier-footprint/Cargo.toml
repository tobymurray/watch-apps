[package]
name = "probe"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
default = []
t0 = []

[dependencies]
inscribed-disc = { path = "../../..", default-features = false, features = ["embedded-graphics", "abgr2222"] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
