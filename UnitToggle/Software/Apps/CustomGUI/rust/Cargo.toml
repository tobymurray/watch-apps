[package]
name = "unit_toggle_gui"
version = "0.1.0"
edition = "2021"
description = "no_std Rust rendering core for UnitToggle: draws a two-position metric/imperial choice into an 8bpp ABGR2222 framebuffer over a C ABI, with a host simulator that runs the same render()."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "sim"
required-features = ["sim"]

[features]
std = []
# The device build takes PanicKit's handler, which reports through one
# `panickit_host_panic` the shell defines. This app used to declare its own,
# differing from the other six only in the symbol's name.
device = ["panickit/panic-message"]
sim = ["std", "dep:embedded-graphics-simulator"]

[dependencies]
# A dependency, never a second staticlib: two archives each carrying a
# #[panic_handler] collide at link time.
panickit = { path = "../../../../../PanicKit", default-features = false }
embedded-graphics = "0.8"
# A dependency, never a second staticlib: two archives each carrying a
# #[panic_handler] collide at link time.
textkit = { path = "../../../../../TextKit" }
inscribed-disc = { path = "../../../../../InscribedDisc", default-features = false, features = [
    "abgr2222",
] }
embedded-graphics-simulator = { version = "0.7", optional = true }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
