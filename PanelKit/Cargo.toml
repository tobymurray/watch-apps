[package]
name = "panelkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Immediate-mode GUI primitives for round, low-bit-depth, button-driven panels: lit-disc geometry, ordered dithering, a four-button focus model and a scene catalogue, on embedded-graphics."
repository = "https://github.com/tobymurray/watch-apps"
categories = ["embedded", "no-std", "gui"]
keywords = ["embedded-graphics", "no-std", "gui", "smartwatch", "dithering"]
# The published crate is the Rust half only. The C ABI, GuiShell.hpp and
# panelkit.cmake are this repo's glue to one vendor's SDK and are not part of
# what anyone else would install.
include = ["src/**/*.rs", "README.md", "LICENSE-*"]

[features]
default = []
## Ordered dithering, and the gamut-hull hue dither.
dither = []
## Tier 2 widgets.
widgets = []
## The scene catalogue trait and its byte-hash golden helper.
scenes = []
## A `#[panic_handler]` reporting `file:line` through `panelkit_host_panic`.
## Measured at 319 bytes over reporting nothing. Inert under `std`, so
## `--all-features` and a host test build still work.
panic-handler = []
## Adds the panic message to the location. This is the expensive half: it needs
## `core::fmt`, measured at +2,210 bytes of `.text` linking Spin's real
## renderer, against 319 for the location alone. Opt in when the message is
## worth three kilobytes of a 600 KiB window.
panic-message = ["panic-handler"]
## Host-side helpers and `std` assertions in tests.
std = []
## PNG frames, contact sheets and the gamut sheet. Host-only, and the only
## thing in this crate with a dependency beyond embedded-graphics.
preview = ["std", "scenes", "dep:png"]

[dependencies]
embedded-graphics = "0.8"
png = { version = "0.17", optional = true }

[dev-dependencies]
embedded-graphics = "0.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
