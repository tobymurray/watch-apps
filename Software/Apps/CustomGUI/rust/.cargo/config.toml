# No default target on purpose:
#  - Device build: the app CMake invokes `cargo build --release --target
#    thumbv8m.main-none-eabihf` explicitly (Cortex-M33, hard-float, matching the
#    SDK's -mfpu=fpv5-sp-d16 -mfloat-abi=hard).
#  - Host sim build: `cargo run --bin sim --features sim` builds for the host
#    triple so it can open an SDL window.
# Forcing a default target here would make the sim try to build for the MCU.
